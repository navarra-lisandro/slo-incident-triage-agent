[project]
name = "slo-incident-triage-agent"
version = "0.1.0"
description = "LangGraph agent that triages SLO burn rate incidents"
authors = [
    {name = "Lisandro Navarra",email = "lisandro.navarra.work@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11.9,<4.0"
package-mode = false
dependencies = [
    "langchain (>=1.3.1,<2.0.0)",
    "langchain-anthropic (>=1.4.3,<2.0.0)",
    "langgraph (>=1.2.0,<2.0.0)",
    "langsmith (>=0.8.5,<0.9.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.47.0,<0.48.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.13,<0.16.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.coverage.run]
omit = [
    "agent/api.py",
    "agent/graph.py",
    "agent/main.py",
    "agent/nodes/llm.py",
]

[tool.coverage.report]
fail_under = 100