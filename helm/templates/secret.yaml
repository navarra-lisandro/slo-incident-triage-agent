# helm/templates/secret.yaml
#
# This template documents the required secret structure.
# The actual secret is provisioned before helm install — not by Helm.
# See ADR-015 for secrets management rationale.
#
# To create the secret:
#   kubectl create secret generic {{ .Values.secretName }} \
#     --from-literal=ANTHROPIC_API_KEY=<value> \
#     --from-literal=LANGSMITH_API_KEY=<value> \
#     -n {{ .Values.namespace }}
